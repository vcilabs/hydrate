name: release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Cross-compile binaries
        env:
          CGO_ENABLED: '0'
        run: make dist

      - name: Generate checksums
        working-directory: bin
        run: sha256sum hydrate-* > SHA256SUMS

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          prerelease: true
          generate_release_notes: true
          files: |
            bin/hydrate-darwin64
            bin/hydrate-linux64
            bin/hydrate-linux386
            bin/hydrate-windows64.exe
            bin/hydrate-windows386.exe
            bin/SHA256SUMS
